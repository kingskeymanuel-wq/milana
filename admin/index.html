<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#211D18" />
  <title>MILANA — Administration</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23008060'/><path d='M10 12h12l-1.2 11H11.2z M13 12a3 3 0 0 1 6 0' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <style>:root, :root[data-theme="light"] { --brand: #1D2A24; --brand-strong: #111A16; --brand-soft: #E8E4DB; --topbar: #1D2A24; --focus: #B4935C; --link: #7A5C45; }</style>

  <!-- Applique le thème enregistré avant le premier rendu (évite le flash) -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("moncommerce-reglages") || "{}");
        var t = s.theme || "systeme";
        var dark = t === "sombre" || (t === "systeme" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>

</head>
<body>
  <div id="root"></div>

  <!-- Interface préparée sur le serveur (npm run construire) : React et icônes inclus -->
  <script type="module" src="app.min.js"></script>
</body>
</html>
